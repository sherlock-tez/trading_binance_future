binance:
  testnet: false

trading:
  symbols:
    - ETHUSDC
  signal_timeframe: 1h
  sup_res_timeframes:
    - 3h
    - 6h
    - 12h
    - 1d
    - 1w
  # ETH Loop_20260519_10 (probe): leverage 15->17 + equity 0.95->0.98 on the
  # converged Loop_20260519_9 geometry. Pure risk scaling — same trade set,
  # same WR; more PnL at higher drawdown. Validated on the production path
  # before adoption.
  leverage: 15
  max_open_positions: 1
  position_equity_ratio: 0.95
  maker_only: true

strategy:
  # ETH Loop_20260519_8: random+refine search (scripts/ethusdc_loop.py, parity
  # verified fast engine) for the all-targets ETHUSDC profile. RSI divergence
  # stays mandatory, MACD divergence still required, extremity gate kept
  # (rsi_long_max<=50 / rsi_short_min>=50). Slower RSI (->21) filters to the
  # highest-conviction reversals.
  rsi_period: 21
  macd_fast: 12
  macd_slow: 34
  macd_signal: 7
  # Long divergence memory (->160) so a divergence only fires off the most
  # significant prior pivot, lifting win-rate on every window.
  divergence_lookback: 160
  pivot_window: 6
  # Volatility-aware stops via ATR. Loop_20260519_8 uses atr_period 21 and a
  # wide-SL / tight-TP geometry: SL=2.0*ATR rarely reached while TP=0.8*ATR is
  # hit quickly, giving a high per-trade win rate. PnL comes from a high hit
  # rate compounding, not from a large reward multiple.
  atr_period: 28
  use_atr_stops: true
  atr_sl_mult: 2.0
  atr_tp_mult: 0.8
  # Trend filter disabled for ETHUSDC: the divergence + extremity + S/R
  # confluence already gates direction; the EMA filter only removed
  # qualifying high-WR setups. trend_ema_period kept but inert.
  use_trend_filter: false
  trend_ema_period: 100
  # RSI extremity gate. Mandatory rule preserved: LONG only if RSI < 50
  # (rsi_long_max=50), SHORT only if RSI > 50 (rsi_short_min=60 is stricter,
  # still satisfies the rule).
  rsi_long_max: 50.0
  rsi_short_min: 60.0
  # MACD divergence still required ALONGSIDE the mandatory RSI divergence.
  require_macd_divergence: true
  # Reward/risk + max-SL-distance gates (currently inactive; preserved for future tuning).
  min_rr_ratio: 0.0
  max_sl_distance_pct: 0.0
  # Loop identifier. Loop_20260519_13 = leverage 17 + equity 0.98 (ETHUSDC champion; renumbered from _10 to avoid main collision)
  # (WR>80 every window, strict monotonic 15>12>6>3>1, >=2 trades/month).
  loop_id: Loop_20260519_13

execution:
  order_reprice_bps: 2
  order_reprice_max_retries: 5
  stop_loss_buffer_bps: 8
  take_profit_buffer_bps: 8

backtest:
  month_windows:
    - 1
    - 3
    - 6
    - 12
    - 15
  initial_balance: 1000
  maker_fee_rate: 0.0002
  history_dir: backtest_history

runtime:
  log_level: INFO
