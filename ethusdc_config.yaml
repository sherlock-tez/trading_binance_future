binance:
  testnet: false

trading:
  symbols:
    - ETHUSDC
  signal_timeframe: 1h
  sup_res_timeframes:
    - 3h
    - 6h
    - 12h
    - 1d
    - 1w
  leverage: 17
  max_open_positions: 1
  position_equity_ratio: 0.98
  maker_only: true

strategy:
  # ETH Loop_20260524_3: restores the real ETHUSDC algorithmic baseline after
  # rejecting Loop_20260524_2's sizing-only position_equity_ratio 0.98->1.0
  # change. position_equity_ratio is pinned at 0.98 and is no longer treated as
  # a tuning lever; future improvement must come from signal/stops/filter config.
  rsi_period: 24
  macd_fast: 8
  macd_slow: 21
  macd_signal: 7
  divergence_lookback: 120
  pivot_window: 5
  # Volatility-aware stops via ATR. R/R = sl/tp = 1.0/2.0 = 0.5 (cap of user
  # constraint). Reward distance >= 2x risk distance (favorable per-trade payoff).
  # atr_period bumped 7 -> 9: tighter band excludes a single low-quality early
  # signal and shifts the firing window so a 6th profitable trade lands inside
  # the 15m sample. Verified via production BacktestRunner, not just the fast
  # vectorized engine.
  atr_period: 9
  use_atr_stops: true
  atr_sl_mult: 1.0
  atr_tp_mult: 2.0
  # Trend filter ON @ EMA 200: LONG only when price > EMA, SHORT only when
  # price < EMA. Combined with RSI extremity gate, this narrows entries to
  # high-conviction reversals near the prevailing trend.
  use_trend_filter: true
  trend_ema_period: 200
  # RSI extremity gate (mandatory rule): LONG only if RSI < 50, SHORT only if
  # RSI > 50. Stricter values still satisfy.
  rsi_long_max: 45.0
  rsi_short_min: 50.0
  # MACD divergence required alongside RSI divergence (further restricts signal).
  require_macd_divergence: true
  # Reward/risk + max-SL-distance gates (currently inactive; preserved for future tuning).
  min_rr_ratio: 0.0
  max_sl_distance_pct: 0.0
  # Loop identifier. Loop_20260524_3 rejects the sizing-only Loop_20260524_2
  # and returns to the prior ETHUSDC signal/stops profile with peq pinned.
  loop_id: Loop_20260524_3

execution:
  order_reprice_bps: 2
  order_reprice_max_retries: 5
  stop_loss_buffer_bps: 8
  take_profit_buffer_bps: 8

backtest:
  month_windows:
    - 1
    - 3
    - 6
    - 12
    - 15
  initial_balance: 1000
  maker_fee_rate: 0.0002
  history_dir: backtest_history

runtime:
  log_level: INFO
