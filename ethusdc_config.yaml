binance:
  testnet: false

trading:
  symbols:
    - ETHUSDC
  signal_timeframe: 1h
  sup_res_timeframes:
    - 3h
    - 6h
    - 12h
    - 1d
    - 1w
  leverage: 17
  max_open_positions: 1
  position_equity_ratio: 0.98
  maker_only: true

strategy:
  # ETH Loop_20260520_9: BTC-pattern regime. User added R/R<=0.5 hard +
  # WR>70 hard; ~30k evals showed WR>70 + R/R<=0.5 + tpm>=2 + monotonic is
  # mutually exclusive on ETHUSDC (best minWR ~45-50%). User chose to mirror
  # BTC (relax tpm + mono) so the search could find ETH's high-WR/few-trade
  # config under favorable R:R. Production-path validated (BacktestRunner):
  # WR 100% across all windows, all-positive, R/R=0.5 cap, 15m +205%, DD 0.33%.
  rsi_period: 24
  macd_fast: 8
  macd_slow: 26
  macd_signal: 7
  divergence_lookback: 120
  pivot_window: 5
  # Volatility-aware stops via ATR. R/R = sl/tp = 1.0/2.0 = 0.5 (cap of user
  # constraint). Reward distance >= 2x risk distance (favorable per-trade payoff).
  atr_period: 7
  use_atr_stops: true
  atr_sl_mult: 1.0
  atr_tp_mult: 2.0
  # Trend filter ON @ EMA 200: LONG only when price > EMA, SHORT only when
  # price < EMA. Combined with RSI extremity gate, this narrows entries to
  # high-conviction reversals near the prevailing trend.
  use_trend_filter: true
  trend_ema_period: 200
  # RSI extremity gate (mandatory rule): LONG only if RSI < 50, SHORT only if
  # RSI > 50. Stricter values still satisfy.
  rsi_long_max: 45.0
  rsi_short_min: 50.0
  # MACD divergence required alongside RSI divergence (further restricts signal).
  require_macd_divergence: true
  # Reward/risk + max-SL-distance gates (currently inactive; preserved for future tuning).
  min_rr_ratio: 0.0
  max_sl_distance_pct: 0.0
  # Loop identifier. Loop_20260520_9 = ETHUSDC champion under R/R<=0.5 + WR>70
  # regime (BTC-pattern: high-WR/few-trades/favorable-R:R).
  loop_id: Loop_20260520_9

execution:
  order_reprice_bps: 2
  order_reprice_max_retries: 5
  stop_loss_buffer_bps: 8
  take_profit_buffer_bps: 8

backtest:
  month_windows:
    - 1
    - 3
    - 6
    - 12
    - 15
  initial_balance: 1000
  maker_fee_rate: 0.0002
  history_dir: backtest_history

runtime:
  log_level: INFO
