binance:
  testnet: true

trading:
  symbols:
    - BTCUSDC
  signal_timeframe: 1h
  sup_res_timeframes:
    - 3h
    - 6h
    - 12h
    - 1d
    - 1w
  leverage: 10
  max_open_positions: 1
  position_equity_ratio: 0.95
  maker_only: true

strategy:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  divergence_lookback: 80
  pivot_window: 5
  # Volatility-aware stops via ATR (replaces support/resistance buffer sizing).
  atr_period: 14
  use_atr_stops: true
  atr_sl_mult: 1.0
  atr_tp_mult: 2.0
  # Trend filter on signal timeframe: LONG only when price > EMA, SHORT only when price < EMA.
  use_trend_filter: true
  trend_ema_period: 200
  # RSI extremity gate (stricter than the legacy "LONG<50, SHORT>50" rule on the SHORT side).
  # The original rule must hold; stricter values still satisfy it.
  rsi_long_max: 50.0
  rsi_short_min: 60.0
  # Require both RSI and MACD divergence for entry.
  require_macd_divergence: true
  # Reward/risk + max-SL-distance gates (currently inactive; preserved for future tuning).
  min_rr_ratio: 0.0
  max_sl_distance_pct: 0.0
  # Loop version label. Bump on every algorithm change so trade-history files are not overwritten.
  strategy_version: v1

execution:
  order_reprice_bps: 2
  order_reprice_max_retries: 5
  stop_loss_buffer_bps: 8
  take_profit_buffer_bps: 8

backtest:
  month_windows:
    - 1
    - 3
    - 6
    - 12
    - 15
  initial_balance: 1000
  maker_fee_rate: 0.0002
  history_dir: backtest_history

runtime:
  log_level: INFO
