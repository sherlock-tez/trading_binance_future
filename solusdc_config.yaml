binance:
  testnet: false

trading:
  symbols:
    - SOLUSDC
  signal_timeframe: 1h
  sup_res_timeframes:
    - 1d
    - 1w
  leverage: 8
  max_open_positions: 1
  position_equity_ratio: 1.0
  maker_only: true

strategy:
  # SOLUSDC CHAMPION = Loop_20260519_5. WR>80 + strict-monotonic, PnL
  # maximized. Between-node refinement over _4: divergence_lookback 50->52,
  # atr_period 12->11 (the coarse grids only tested dlb {45,50,55} /
  # atrp {10,12,14} — a fine-resolution sweep found 52/11 strictly better).
  # Production-path backtest (scripts/btcusdc_optimize.py, mainnet klines,
  # 12m warmup, 1/3/6/12/15m):
  #   1m +28.0% WR100  | 3m +132.0% WR94.1 | 6m +300.0% WR90.6
  #   12m +1597.7% WR89.9 | 15m +2875.7% WR90.7 | 75 trades, strict monotonic.
  # Min WR 89.9% (12m) > 80 MUST; all-positive; trades 5.0-5.8/mo; 12m/15m
  # max drawdown ~64% (UNCHANGED vs _4 — same leverage 8). Beats every prior
  # champion: _4 (15m +2073%, minWR 89.2%), _3 (+1543%), _2 (+1164%),
  # _1 (+879%), _31 (+289%), old non-compliant _7 (+784% but minWR 73.9%).
  # Unlock chain: (1) faster MACD + MACD-div confluence ON reshapes pivots
  # so the high-WR trade set survives the ~4-6mo-ago drawdown patch that
  # broke monotonicity elsewhere (-> _31). (2) leverage 5->7, eq 0.95->1.0
  # scaled PnL (-> _1). (3) macd 6/21->7/24, pivot_window 5->6,
  # divergence_lookback 45->50 sharpened the edge (-> _2). (4) leverage 7->8
  # (user-selected from the lev 7-10 PnL/DD curve) -> _3. (5) S/R timeframes
  # narrowed to [1d,1w]: +34% 15m PnL at identical DD (-> _4). (6) fine-grid
  # between-node tune dlb 50->52 / atrp 12->11: +39% more 15m PnL AND
  # +0.6pt min WR at identical leverage/drawdown (-> _5).
  # atr_tp_mult held at 1.0: every wider-TP variant tested across many gates
  # drops min WR below 80, so the reward-extension hint is firmly bounded by
  # the WR>80 MUST. Mandatory RSI-divergence + extremity gate LONG<50 /
  # SHORT>50 preserved (45/55).
  rsi_period: 14
  macd_fast: 7
  macd_slow: 24
  macd_signal: 9
  divergence_lookback: 52
  pivot_window: 6
  atr_period: 11
  use_atr_stops: true
  atr_sl_mult: 3.0
  atr_tp_mult: 1.0
  use_trend_filter: false
  trend_ema_period: 200
  rsi_long_max: 45.0
  rsi_short_min: 55.0
  require_macd_divergence: true
  min_rr_ratio: 0.0
  max_sl_distance_pct: 0.0
  loop_id: Loop_20260519_5

execution:
  order_reprice_bps: 2
  order_reprice_max_retries: 5
  stop_loss_buffer_bps: 8
  take_profit_buffer_bps: 8

backtest:
  month_windows:
    - 1
    - 3
    - 6
    - 12
    - 15
  initial_balance: 1000
  maker_fee_rate: 0.0002
  history_dir: backtest_history

runtime:
  log_level: INFO
