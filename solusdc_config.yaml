binance:
  testnet: false

trading:
  symbols:
    - SOLUSDC
  signal_timeframe: 1h
  sup_res_timeframes:
    - 3h
    - 6h
    - 12h
    - 1d
    - 1w
  leverage: 5
  max_open_positions: 1
  position_equity_ratio: 0.95
  maker_only: true

strategy:
  # SOLUSDC CHAMPION = Loop_20260518_31. First config to clear the WR>80
  # wall while staying strictly monotonic. Production-path backtest
  # (scripts/btcusdc_optimize.py, mainnet klines, 12m warmup, windows
  # 1/3/6/12/15m):
  #   1m +20.2% WR100  | 3m +64.1% WR94.1 | 6m +71.1% WR87.1
  #   12m +130.6% WR82.2 | 15m +289.1% WR84.2 | 82 trades, strict monotonic.
  # Min WR 82.2% (12m) > 80 MUST; all-positive; trades 5.2-6.1/mo. The prior
  # champion (_7) had bigger 15m PnL (+784%) but FAILED WR>80 (min 73.9%).
  # The unlock was the faster MACD (6/21/9 vs 12/26/9) + MACD-divergence
  # confluence ON: it reshapes the divergence pivots so the high-WR trade set
  # is net-positive through the ~4-6mo-ago drawdown patch that broke
  # monotonicity for every other WR>80 config. Mandatory RSI-divergence +
  # extremity gate LONG<50 / SHORT>50 preserved (45/55). PnL is the next
  # optimization target within the WR>80 feasible region.
  rsi_period: 14
  macd_fast: 6
  macd_slow: 21
  macd_signal: 9
  divergence_lookback: 40
  pivot_window: 5
  atr_period: 14
  use_atr_stops: true
  atr_sl_mult: 3.0
  atr_tp_mult: 1.0
  use_trend_filter: false
  trend_ema_period: 200
  rsi_long_max: 45.0
  rsi_short_min: 55.0
  require_macd_divergence: true
  min_rr_ratio: 0.0
  max_sl_distance_pct: 0.0
  loop_id: Loop_20260518_31

execution:
  order_reprice_bps: 2
  order_reprice_max_retries: 5
  stop_loss_buffer_bps: 8
  take_profit_buffer_bps: 8

backtest:
  month_windows:
    - 1
    - 3
    - 6
    - 12
    - 15
  initial_balance: 1000
  maker_fee_rate: 0.0002
  history_dir: backtest_history

runtime:
  log_level: INFO
