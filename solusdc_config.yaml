binance:
  testnet: false

trading:
  symbols:
    - SOLUSDC
  signal_timeframe: 1h
  sup_res_timeframes:
    - 3h
    - 6h
    - 12h
    - 1d
    - 1w
  leverage: 5
  max_open_positions: 1
  position_equity_ratio: 0.95
  maker_only: true

strategy:
  # SOLUSDC FINAL CHAMPION = Loop_20260518_7. Best of 30 configs / 9
  # iterations. Backtest (mainnet klines, 12m warmup):
  #   1m +12.6% WR80.0 | 3m +29.3% WR73.9 | 6m +85.0% WR75.5
  #   12m +312.7% WR74.4 | 15m +659.6% WR73.9 | 153 trades, perfectly monotonic.
  # Meets PnL, trade-count, and the monotonic-consistency MUST. WR ~74% is
  # the profitable-region ceiling; WR>80 was conclusively shown to require
  # negative PnL (hard Pareto wall). Even isolated MACD-confluence (iter 9
  # _28) cut 15m PnL to +14% without raising long-window WR. Mandatory
  # RSI-divergence + extremity LONG<50/SHORT>50 preserved.
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  divergence_lookback: 50
  pivot_window: 3
  atr_period: 14
  use_atr_stops: true
  atr_sl_mult: 3.0
  atr_tp_mult: 1.5
  use_trend_filter: false
  trend_ema_period: 200
  rsi_long_max: 50.0
  rsi_short_min: 50.0
  require_macd_divergence: false
  min_rr_ratio: 0.0
  max_sl_distance_pct: 0.0
  loop_id: Loop_20260518_7

execution:
  order_reprice_bps: 2
  order_reprice_max_retries: 5
  stop_loss_buffer_bps: 8
  take_profit_buffer_bps: 8

backtest:
  month_windows:
    - 1
    - 3
    - 6
    - 12
    - 15
  initial_balance: 1000
  maker_fee_rate: 0.0002
  history_dir: backtest_history

runtime:
  log_level: INFO
