binance:
  testnet: false

trading:
  symbols:
    - SOLUSDC
  signal_timeframe: 1h
  sup_res_timeframes:
    - 1d
    - 1w
  leverage: 8
  max_open_positions: 1
  position_equity_ratio: 1.0
  maker_only: true

strategy:
  # SOLUSDC CHAMPION = Loop_20260519_8 (feasible-region champion under the
  # NEW hard constraint Risk/Reward = atr_sl_mult/atr_tp_mult <= 0.5, i.e.
  # reward TP >= 2x risk SL, imposed by the user 2026-05-19).
  # CONSTRAINT CHANGE: the prior champion _7 (sl2.85/tp1.0, R/R 2.85) is the
  # degenerate wide-SL/tiny-TP geometry this cap forbids -> now INFEASIBLE.
  # The whole feasible region inverts to tight-SL/far-TP. Under R/R<=0.5 the
  # win-rate is STRUCTURALLY ~20-36% — the WR>80 target is UNREACHABLE here;
  # that is the accepted, explicit tradeoff of the R/R cap (do NOT revert to
  # the _7 basin to chase WR). Among all feasible configs we surface the
  # max-PnL one that still clears the other hard items (strict-monotonic PnL
  # 15>12>6>3>1, all-positive, 2-5 trades/mo).
  # Winner found by scripts/btcusdc_sweep.py grid=sol_rr --maxrr 0.5:
  #   sl 0.8 / tp 5.0 (R/R 0.16), atr_period 10, gate 45/55, rest = _7 edge
  #   (macd 7/24/9, dlb52, pivot6, [1d,1w] S/R, lev8, MACD-div required).
  # Production-path backtest (scripts/btcusdc_optimize.py, mainnet klines,
  # 12m warmup, 1/3/6/12/15m): see changes.md for the confirmed numbers.
  # Fast-harness: 1m +11.5/WR20 | 3m +233.7/WR35 | 6m +402.2/WR28 |
  #   12m +1732.1/WR26 | 15m +5490.9/WR29 | ~5 tr/mo, strict-monotonic.
  # 15m PnL (+5490%) actually EXCEEDS _7 (+3287%): the reward>=2x-risk
  # geometry rides large trending moves; equity is LUMPY (few big winners
  # carry a ~28% hit-rate) and the 0.8-ATR stop is tight -> expect long
  # losing streaks and high path-variance at leverage 8. R/R cap enforced
  # by construction in the sweep (MAX_RISK_REWARD=0.5 / --maxrr).
  # Mandatory RSI-divergence + extremity gate LONG<50 / SHORT>50 preserved (45/55).
  rsi_period: 14
  macd_fast: 7
  macd_slow: 24
  macd_signal: 9
  divergence_lookback: 52
  pivot_window: 6
  atr_period: 10  # _8: re-tuned for the far-TP (reward>=2x risk) regime
  use_atr_stops: true
  atr_sl_mult: 0.8  # _8: tight SL — R/R = 0.8/5.0 = 0.16 <= 0.5 MUST
  atr_tp_mult: 5.0  # _8: reward >= 2x risk (was 1.0; _7 geometry now forbidden)
  use_trend_filter: false
  trend_ema_period: 200
  rsi_long_max: 45.0
  rsi_short_min: 55.0
  require_macd_divergence: true
  min_rr_ratio: 0.0
  max_sl_distance_pct: 0.0
  loop_id: Loop_20260519_8

execution:
  order_reprice_bps: 2
  order_reprice_max_retries: 5
  stop_loss_buffer_bps: 8
  take_profit_buffer_bps: 8

backtest:
  month_windows:
    - 1
    - 3
    - 6
    - 12
    - 15
  initial_balance: 1000
  maker_fee_rate: 0.0002
  history_dir: backtest_history

runtime:
  log_level: INFO
