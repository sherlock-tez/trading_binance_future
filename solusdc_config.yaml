binance:
  testnet: false

trading:
  symbols:
    - SOLUSDC
  signal_timeframe: 1h
  sup_res_timeframes:
    - 3h
    - 6h
    - 12h
    - 1d
    - 1w
  leverage: 7
  max_open_positions: 1
  position_equity_ratio: 1.0
  maker_only: true

strategy:
  # SOLUSDC CHAMPION = Loop_20260519_1. WR>80 + strict-monotonic, with PnL
  # maximized inside that feasible region. Production-path backtest
  # (scripts/btcusdc_optimize.py, mainnet klines, 12m warmup, 1/3/6/12/15m):
  #   1m +30.6% WR100  | 3m +106.4% WR94.1 | 6m +109.8% WR87.1
  #   12m +275.2% WR83.1 | 15m +879.0% WR85.2 | 88 trades, strict monotonic.
  # Min WR 83.1% (12m) > 80 MUST; all-positive; trades 5.2-6.4/mo. Beats the
  # old non-compliant champion _7 (15m +784%, but min WR 73.9% — failed
  # WR>80) AND the first compliant config _31 (15m +289%).
  # Unlock chain: faster MACD (6/21/9 vs 12/26/9) + MACD-divergence
  # confluence ON reshapes the divergence pivots so the high-WR trade set is
  # net-positive through the ~4-6mo-ago drawdown patch that broke
  # monotonicity for every other WR>80 config (-> _31). Then PnL was scaled
  # within the WR>80 basin via leverage 5->7, equity_ratio 0.95->1.0,
  # divergence_lookback 40->45, atr_period 14->12 (TP held at 1.0 — wider TP
  # drops min WR below 80, so reward-extension is capped by the WR MUST).
  # RISK: leverage 7 raises 12m/15m max drawdown to ~62% (vs _31 ~48%).
  # Mandatory RSI-divergence + extremity gate LONG<50 / SHORT>50 preserved
  # (45/55).
  rsi_period: 14
  macd_fast: 6
  macd_slow: 21
  macd_signal: 9
  divergence_lookback: 45
  pivot_window: 5
  atr_period: 12
  use_atr_stops: true
  atr_sl_mult: 3.0
  atr_tp_mult: 1.0
  use_trend_filter: false
  trend_ema_period: 200
  rsi_long_max: 45.0
  rsi_short_min: 55.0
  require_macd_divergence: true
  min_rr_ratio: 0.0
  max_sl_distance_pct: 0.0
  loop_id: Loop_20260519_1

execution:
  order_reprice_bps: 2
  order_reprice_max_retries: 5
  stop_loss_buffer_bps: 8
  take_profit_buffer_bps: 8

backtest:
  month_windows:
    - 1
    - 3
    - 6
    - 12
    - 15
  initial_balance: 1000
  maker_fee_rate: 0.0002
  history_dir: backtest_history

runtime:
  log_level: INFO
