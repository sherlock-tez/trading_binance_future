binance:
  testnet: false

trading:
  symbols:
    - SOLUSDC
  signal_timeframe: 1h
  sup_res_timeframes:
    - 1d
    - 1w
  leverage: 8
  max_open_positions: 1
  position_equity_ratio: 0.95
  maker_only: true

strategy:
  # SOLUSDC CHAMPION = Loop_20260521_3 (succeeds _3 via pivot_window 6->5 +
  # rsi_short_min 60->65; found by wr80_atr3_cross at the atr_p=3 anchor).
  # USER TARGETS (2026-05-20 round 3): R/R <= 0.5 AND WR > 80 HARD AND
  # strict-mono + all-positive on ACTIVE windows; "increase number of
  # trades" directional. RSI extremity (LONG<50/SHORT>50) + MACDdiv required.
  # Lineage to _4 (each step strict Pareto over previous):
  #   _11 (Loop_20260520_1): atr_p 12, rsi 45/60, pivot 6 -> 15m +170/WR85.7/7tr
  #   _2  (Loop_20260521_1): rsi_long 45->47 -> 15m +211/WR87.5/8tr
  #   _3  (Loop_20260521_2): atr_p 8->3 (gradient peak) -> 15m +402/WR100/8tr
  #   _4  (Loop_20260521_3): pivot 6->5 + rsi_short 60->65 -> 15m +534/WR100/9tr
  # _4 source: scripts/solusdc_sweep.py --grid wr80_atr3_cross (864 combos
  # at atr_p=3, varying pivot/dlb/RSI gates/trend EMA/S/R). 66 passers; #1
  # is (pivot=5, rsi_long=47, rsi_short=65, dlb=80, trend=200, sup_res
  # invariant). The pivot=5+rsi_short=65 combo unlocks +1 LONG trade at 15m
  # (8->9) and +1 at 12m (6->7) while keeping all 9 trades winning (15m WR
  # remains 100%). Robust to sup_res choice ([1d,1w] = [6h,12h,1d,1w]
  # exactly tied in score and trade path).
  # Production path (scripts/btcusdc_optimize.py, mainnet, 12m warmup):
  #   1m: 0 tr (neutral) | 3m +33.4/WR100 (1) | 6m +85.4/WR100 (3)
  #   12m +269.7/WR100 (7) | 15m +533.77/WR100 (9); strict-mono ✓,
  #   all-positive ✓, max DD 0.16% (no SL hit in-sample), Sharpe 6.83.
  # OOS held-out (extended cache to 24m then reverted to 15):
  #   18m: +533.77/WR100 (9 tr, no new trades 15->18m)
  #   24m: +545.54/WR83.33 (12 tr, +3 vs 15m: 1W/2L; net positive)
  # 24m OOS PnL EXCEEDS in-sample 15m (+545.54 > +533.77) because 1 OOS
  # winner outweighs the 2 OOS losers on compounded equity. 24m OOS WR
  # 83.33% has comfortable headroom over the >80 floor (was 80.0 in _3).
  # 24m OOS max DD halves (15.17 -> 8.73%).
  # TRADEOFF vs _3: STRICT WIN on every dim (+131pt 15m PnL, +1 in-sample tr,
  # +0 WR delta but +1 trade at 100%, +218pt 24m OOS PnL, +3.3pt 24m OOS WR,
  # -6.4pt 24m DD). No tradeoff dial. Trade count rises 8->9 in-sample,
  # 10->12 OOS at 24m.
  # R/R cap enforced by construction (sl 1.0 / tp 2.0 = 0.5 exactly).
  rsi_period: 14
  macd_fast: 7
  macd_slow: 24
  macd_signal: 9
  divergence_lookback: 80  # _11: 52 -> 80 (longer confirmation for high-WR regime)
  pivot_window: 5  # Loop_20260521_3: was 6 in _3; pivot=5+rsi_short=65 unlocks +1 trade
  atr_period: 3  # Loop_20260521_2: _2's 8 -> 3 (peak of atr gradient; atr_p=2 BREAKS)
  use_atr_stops: true
  atr_sl_mult: 1.0  # at R/R cap 0.5 (sl 1.0 / tp 2.0)
  atr_tp_mult: 2.0
  use_trend_filter: true  # trend filter ON (WR backbone)
  trend_ema_period: 200
  rsi_long_max: 47.0  # Loop_20260521_1: _11's 45 -> 47 (unlocks 1 extra LONG, still <50 extremity rule)
  rsi_short_min: 65.0  # Loop_20260521_3: was 60 in _3; pairs with pivot=5
  require_macd_divergence: true
  min_rr_ratio: 0.0
  max_sl_distance_pct: 0.0
  loop_id: Loop_20260521_3
  # Loop_20260521_3 succeeds _3 via wr80_atr3_cross sweep (864 combos at
  # atr_period=3 anchor): pivot_window 6->5 + rsi_short_min 60->65 unlocks
  # +1 LONG-side trade (15m 8->9, 12m 6->7) while keeping all-100% WR
  # in-sample and lifting 15m PnL +131pt (402->534). 24m OOS PnL grows to
  # +545.54 (now higher than 15m in-sample was for _3) with WR climbing
  # 80.0->83.33% (more headroom over the >80 floor). Max DD at 24m halves
  # (15.17->8.73%). Strict Pareto on every dimension over _3.

execution:
  order_reprice_bps: 2
  order_reprice_max_retries: 5
  stop_loss_buffer_bps: 8
  take_profit_buffer_bps: 8

backtest:
  month_windows:
    - 1
    - 3
    - 6
    - 12
    - 15
  initial_balance: 1000
  maker_fee_rate: 0.0002
  history_dir: backtest_history

runtime:
  log_level: INFO
