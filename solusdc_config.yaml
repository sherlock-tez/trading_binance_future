binance:
  testnet: false

trading:
  symbols:
    - SOLUSDC
  signal_timeframe: 1h
  sup_res_timeframes:
    - 3h
    - 6h
    - 12h
    - 1d
    - 1w
  leverage: 7
  max_open_positions: 1
  position_equity_ratio: 1.0
  maker_only: true

strategy:
  # SOLUSDC CHAMPION = Loop_20260519_2. WR>80 + strict-monotonic, PnL
  # maximized via a higher-conviction entry edge (NOT more leverage).
  # Production-path backtest (scripts/btcusdc_optimize.py, mainnet klines,
  # 12m warmup, 1/3/6/12/15m):
  #   1m +24.4% WR100  | 3m +109.3% WR94.1 | 6m +134.8% WR87.5
  #   12m +572.1% WR86.8 | 15m +1164.5% WR88.0 | 75 trades, strict monotonic.
  # Min WR 86.8% (12m) > 80 MUST; all-positive; trades 5.0-5.7/mo; 12m/15m
  # max drawdown ~57%. Beats prior champions: _1 (15m +879%, min WR 83.1%,
  # DD ~62%), _31 (15m +289%), and old non-compliant _7 (15m +784% but min
  # WR 73.9%). The stricter gate raised PnL AND win rate AND lowered
  # drawdown at the same leverage.
  # Unlock chain: (1) faster MACD + MACD-div confluence ON reshapes pivots
  # so the high-WR trade set survives the ~4-6mo-ago drawdown patch that
  # broke monotonicity elsewhere (-> _31). (2) leverage 5->7, eq 0.95->1.0
  # scaled PnL (-> _1). (3) macd_slow 21->24, pivot_window 5->6,
  # divergence_lookback 45->50 sharpened the entry edge: fewer, higher-
  # conviction trades -> +1164% at min WR 86.8% with LOWER drawdown (-> _2).
  # atr_tp_mult held at 1.0: every wider-TP variant tested across multiple
  # gates drops min WR below 80, so the reward-extension hint is bounded by
  # the WR>80 MUST. Mandatory RSI-divergence + extremity gate LONG<50 /
  # SHORT>50 preserved (45/55).
  rsi_period: 14
  macd_fast: 7
  macd_slow: 24
  macd_signal: 9
  divergence_lookback: 50
  pivot_window: 6
  atr_period: 12
  use_atr_stops: true
  atr_sl_mult: 3.0
  atr_tp_mult: 1.0
  use_trend_filter: false
  trend_ema_period: 200
  rsi_long_max: 45.0
  rsi_short_min: 55.0
  require_macd_divergence: true
  min_rr_ratio: 0.0
  max_sl_distance_pct: 0.0
  loop_id: Loop_20260519_2

execution:
  order_reprice_bps: 2
  order_reprice_max_retries: 5
  stop_loss_buffer_bps: 8
  take_profit_buffer_bps: 8

backtest:
  month_windows:
    - 1
    - 3
    - 6
    - 12
    - 15
  initial_balance: 1000
  maker_fee_rate: 0.0002
  history_dir: backtest_history

runtime:
  log_level: INFO
