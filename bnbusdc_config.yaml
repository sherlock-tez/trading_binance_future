binance:
  testnet: false

trading:
  symbols:
    - BNBUSDC
  signal_timeframe: 1h
  sup_res_timeframes:
    - 1d
    - 1w
  leverage: 10
  max_open_positions: 1
  position_equity_ratio: 0.98
  maker_only: true

strategy:
  # BNBUSDC CHAMPION = Loop_20260523_1 (WR>80 strict-monotonic production pass).
  # User HARD constraints: Risk/Reward = atr_sl_mult/atr_tp_mult MUST <= 0.5
  # (reward TP >= 2x risk SL); leverage pinned at 10.
  # Geometry SL 2.0 ATR / TP 4.0 ATR -> R/R = 0.5 (reward = 2x risk).
  # Production-path candidate:
  #   1m +16.57% | 3m +65.99% | 6m +309.93% | 12m +599.33% | 15m +633.64%
  #   WR 100% / 100% / 85.71% / 88.89% / 81.82%, strict 15>12>6>3>1.
  # Mandatory RSI-divergence + extremity LONG<41 / SHORT>55 preserved.
  # require_macd_divergence false (RSI-divergence only); macd params inert.
  rsi_period: 11
  macd_fast: 10
  macd_slow: 40
  macd_signal: 9
  divergence_lookback: 140
  pivot_window: 15
  atr_period: 18
  use_atr_stops: true
  atr_sl_mult: 2.0
  atr_tp_mult: 4.0
  use_trend_filter: true
  trend_ema_period: 300
  rsi_long_max: 41.0
  rsi_short_min: 55.0
  require_macd_divergence: false
  min_rr_ratio: 0.0
  max_sl_distance_pct: 0.0
  loop_id: Loop_20260523_1

execution:
  order_reprice_bps: 2
  order_reprice_max_retries: 5
  stop_loss_buffer_bps: 8
  take_profit_buffer_bps: 8

backtest:
  month_windows:
    - 1
    - 3
    - 6
    - 12
    - 15
  initial_balance: 1000
  maker_fee_rate: 0.0002
  history_dir: backtest_history

runtime:
  log_level: INFO
