binance:
  testnet: false

trading:
  symbols:
    - BNBUSDC
  signal_timeframe: 1h
  sup_res_timeframes:
    - 3h
    - 6h
    - 12h
    - 1d
    - 1w
  leverage: 10
  max_open_positions: 1
  position_equity_ratio: 0.98
  maker_only: true

strategy:
  # BNBUSDC CHAMPION = Loop_20260522_2 (PnL+WR Pareto over Loop_20260522_1;
  # DD still below prior Loop_20260520_5 baseline of 40.82%).
  # User HARD constraints: Risk/Reward = atr_sl_mult/atr_tp_mult MUST <= 0.5
  # (reward TP >= 2x risk SL); leverage pinned at 10 and position_equity_ratio
  # pinned at 0.95 (position-size is not a tuning lever, like leverage).
  # Geometry SL 2.0 ATR / TP 4.0 ATR -> R/R = 0.5 (reward = 2x risk).
  # Production-validated at peq=0.95 (scripts/backtest.py):
  #   1m +44.36% | 3m +170.06% | 6m +259.38% | 12m +11144.27% | 15m +23588.09%
  # Strictly monotonic 15>12>6>3>1, all-positive, 2.0-3.75 trades/mo.
  # WR 55-100% per window (NOT >80 min): structural under R/R<=0.5.
  # max DD 40.28% -- below original Loop_20260520_5 baseline (40.82%).
  # Per-window WR: 1m=100% / 3m=66.67% / 6m=55% / 12m=55.56% / 15m=58.82%.
  # Strict Pareto vs original Loop_20260520_5 on ALL three dimensions:
  #   PnL 15m: 23588% (was 2816%)  -- +8.4x
  #   DD     : 40.28% (was 40.82%) -- -0.5pt
  #   min_wr : 55%    (was 48%)    -- +7pt
  # Pareto improvement vs Loop_20260522_1 (PnL+WR axes):
  #   PnL 15m: 23588% (was 14997%) -- +57%
  #   min_wr : 55%    (was 50%)    -- +5pt
  #   DD     : 40.28% (was 31.31%) -- +8.97pt (back to original baseline)
  # Mandatory RSI-divergence + extremity LONG<15 / SHORT>65 preserved
  # (deep oversold/overbought far past the <=50/>=50 thresholds).
  # Config delta vs _1: atr_period 21->10, rsi_short_min 70->65.
  # require_macd_divergence false (RSI-divergence only); macd params inert.
  # Adopted 2026-05-22 via DD-aware refine (seed 305411, ~2k evals).
  rsi_period: 5
  macd_fast: 8
  macd_slow: 21
  macd_signal: 7
  divergence_lookback: 60
  pivot_window: 8
  atr_period: 10
  use_atr_stops: true
  atr_sl_mult: 2.0
  atr_tp_mult: 4.0
  use_trend_filter: false
  trend_ema_period: 200
  rsi_long_max: 15.0
  rsi_short_min: 65.0
  require_macd_divergence: false
  min_rr_ratio: 0.0
  max_sl_distance_pct: 0.0
  loop_id: Loop_20260522_2

execution:
  order_reprice_bps: 2
  order_reprice_max_retries: 5
  stop_loss_buffer_bps: 8
  take_profit_buffer_bps: 8

backtest:
  month_windows:
    - 1
    - 3
    - 6
    - 12
    - 15
  initial_balance: 1000
  maker_fee_rate: 0.0002
  history_dir: backtest_history

runtime:
  log_level: INFO
