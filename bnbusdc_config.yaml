binance:
  testnet: false

trading:
  symbols:
    - BNBUSDC
  signal_timeframe: 1h
  sup_res_timeframes:
    - 3h
    - 6h
    - 12h
    - 1d
    - 1w
  leverage: 10
  max_open_positions: 1
  position_equity_ratio: 1.0
  maker_only: true

strategy:
  # BNBUSDC CHAMPION = Loop_20260524_1 (full PnL/trade-count improvement over Loop_20260523_2).
  # User HARD constraints: Risk/Reward = atr_sl_mult/atr_tp_mult MUST <= 0.5
  # (reward TP >= 2x risk SL); leverage pinned at 10.
  # Geometry SL 2.0 ATR / TP 4.1 ATR -> R/R = 0.488 (reward > 2x risk).
  # Production-path candidate:
  #   1m +43.91% | 3m +132.46% | 6m +422.09% | 12m +831.28% | 15m +2013.27%
  #   WR 100% / 83.33% / 88.89% / 84.62% / 84.21%, strict 15>12>6>3>1.
  # Mandatory RSI-divergence + extremity LONG<46 / SHORT>70 preserved.
  # require_macd_divergence false (RSI-divergence only); macd params inert.
  rsi_period: 5
  macd_fast: 10
  macd_slow: 40
  macd_signal: 9
  divergence_lookback: 220
  pivot_window: 20
  atr_period: 34
  use_atr_stops: true
  atr_sl_mult: 2.0
  atr_tp_mult: 4.1
  use_trend_filter: true
  trend_ema_period: 150
  rsi_long_max: 46.0
  rsi_short_min: 70.0
  require_macd_divergence: false
  min_rr_ratio: 0.0
  max_sl_distance_pct: 0.022
  loop_id: Loop_20260524_1

execution:
  order_reprice_bps: 2
  order_reprice_max_retries: 5
  stop_loss_buffer_bps: 8
  take_profit_buffer_bps: 8

backtest:
  month_windows:
    - 1
    - 3
    - 6
    - 12
    - 15
  initial_balance: 1000
  maker_fee_rate: 0.0002
  history_dir: backtest_history

runtime:
  log_level: INFO
