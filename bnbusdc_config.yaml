binance:
  testnet: false

trading:
  symbols:
    - BNBUSDC
  signal_timeframe: 1h
  sup_res_timeframes:
    - 3h
    - 6h
    - 12h
    - 1d
    - 1w
  leverage: 10
  max_open_positions: 1
  position_equity_ratio: 1.0
  maker_only: true

strategy:
  # BNBUSDC CHAMPION = Loop_20260519_2 (edge refine, parity-verified).
  # Backtest (production path, [1,3,6,12,15]m + 12m warmup):
  #   1m +7.6% WR100 | 3m +34.4% WR100 | 6m +150.6% WR100
  #   | 12m +540.8% WR100 | 15m +1003.4% WR100
  # Strictly monotonic 15>12>6>3>1, all-positive, WR 100% on EVERY window,
  # 3.0-3.9 trades/mo, max DD ~0.2%. Strictly better than _20260519_1
  # (rsi_period 14->11, rsi_short_min 70->75 even stricter short gate):
  # higher PnL at identical perfect-WR / near-zero-DD risk profile.
  # Wide SL (6 ATR) + very tight TP (0.6 ATR), pivot 6, lookback 80,
  # trend filter off, MACD-div not required.
  # Mandatory RSI-divergence + extremity LONG<50 / SHORT>75 preserved.
  rsi_period: 11
  macd_fast: 12
  macd_slow: 26
  macd_signal: 12
  divergence_lookback: 80
  pivot_window: 6
  atr_period: 21
  use_atr_stops: true
  atr_sl_mult: 6.0
  atr_tp_mult: 0.6
  use_trend_filter: false
  trend_ema_period: 200
  rsi_long_max: 50.0
  rsi_short_min: 75.0
  require_macd_divergence: false
  min_rr_ratio: 0.0
  max_sl_distance_pct: 0.0
  loop_id: Loop_20260519_2

execution:
  order_reprice_bps: 2
  order_reprice_max_retries: 5
  stop_loss_buffer_bps: 8
  take_profit_buffer_bps: 8

backtest:
  month_windows:
    - 1
    - 3
    - 6
    - 12
    - 15
  initial_balance: 1000
  maker_fee_rate: 0.0002
  history_dir: backtest_history

runtime:
  log_level: INFO
