binance:
  testnet: false

trading:
  symbols:
    - DOGEUSDC
  signal_timeframe: 1h
  sup_res_timeframes:
    - 3h
    - 6h
    - 12h
    - 1d
    - 1w
  leverage: 5
  max_open_positions: 1
  position_equity_ratio: 0.95
  maker_only: true

strategy:
  # DOGEUSDC FINAL (least-bad of 30 configs) = Loop_20260518_11. Backtest:
  #   1m -0.3% | 3m +63.7% WR90 | 6m +2.2% | 12m -48.4% | 15m -43.6% WR66.7
  # DOGE's divergence-reversal edge is STRUCTURALLY NEGATIVE on 12m/15m;
  # every lever swept in isolation and combination. RECOMMENDATION: do not
  # trade DOGEUSDC with this strategy. Mandatory RSI-divergence + extremity
  # LONG<50/SHORT>60 preserved (40/60 stricter).
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  divergence_lookback: 60
  pivot_window: 5
  atr_period: 14
  use_atr_stops: true
  atr_sl_mult: 3.0
  atr_tp_mult: 1.5
  use_trend_filter: false
  trend_ema_period: 200
  rsi_long_max: 40.0
  rsi_short_min: 60.0
  require_macd_divergence: true
  min_rr_ratio: 0.0
  max_sl_distance_pct: 0.0
  loop_id: Loop_20260518_11

execution:
  order_reprice_bps: 2
  order_reprice_max_retries: 5
  stop_loss_buffer_bps: 8
  take_profit_buffer_bps: 8

backtest:
  month_windows:
    - 1
    - 3
    - 6
    - 12
    - 15
  initial_balance: 1000
  maker_fee_rate: 0.0002
  history_dir: backtest_history

runtime:
  log_level: INFO
